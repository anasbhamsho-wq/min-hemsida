<!DOCTYPE html>
<html lang="sv">
<head>
    <meta charset="UTF-8">
    <title>Anas Hamsho</title>

    <style>
        body {
            margin: 0;
            padding: 60px;
        }

        .tabell {
            width: 600px;
            height: 600px;
            display: grid;
            grid-template-columns: 150px 300px 150px;
            grid-template-rows: 160px 310px 130px;
            border: 4px solid black;
        }

        .ruta {
            border: 2px solid black;
            box-sizing: border-box;
        }

        .rod {
            background-color: red;
        }

        .gron {
            background-color: green;
        }

        .vit {
            background-color: white;
        }

        .smiley-ruta {
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .bild-liten {
            width: 140px;
            height: 150px;
            object-fit: contain;
        }

        .bild-stor {
            width: 290px;
            height: 300px;
            object-fit: contain;
        }

        .namn {
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: Georgia, serif;
            font-style: italic;
            font-size: 20px;
        }
    </style>
</head>

<body>

    <div class="tabell">

        <!-- Övre vänster -->
        <div class="ruta vit smiley-ruta">
            <img src="smile.jpg" class="bild-liten">
        </div>

        <!-- Övre mitten -->
        <div class="ruta rod"></div>

        <!-- Övre höger -->
        <div class="ruta vit smiley-ruta">
            <img src="smile.jpg" class="bild-liten">
        </div>

        <!-- Mitten vänster -->
        <div class="ruta rod"></div>

        <!-- Stor smiley -->
        <div class="ruta vit smiley-ruta">
            <img src="smile.jpg" class="bild-stor">
        </div>

        <!-- Grön ruta -->
        <div class="ruta gron"
             style="grid-row: 2 / 4; grid-column: 3;">
        </div>

        <!-- Namn -->
        <div class="ruta vit namn"
             style="grid-column: 1 / 3;">
            Anas Hamsho
        </div>

    </div>

</body>
</html>
