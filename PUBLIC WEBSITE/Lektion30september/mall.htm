<!DOCTYPE html>
<html>
<head>
    <title>Tabell</title>

    <style>
        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
        }

        table {
            width: 100%;
            height: 100vh;
            border: 1px solid cyan;
            border-collapse: collapse;
        }

        td {
            border: 1px solid cyan;
            font-size: 24px;
        }
    </style>
</head>

<body bgcolor="Lavender">

<table>

    <tr>
        <td bgcolor="yellow" colspan="4" height="20%"
            align="center" valign="middle">
            <font color="red" size="5">Tabell</font>
        </td>
    </tr>

    <tr>
        <td bgcolor="BlueViolet" colspan="2"
            align="center">
            <font color="white">1</font>
        </td>

        <td bgcolor="DarkRed"
            align="right">
            <font color="white">2</font>
        </td>

        <td bgcolor="FireBrick"
            align="left" valign="middle">
            <font color="black" size="6">3</font>
        </td>
    </tr>

    <tr>
        <td bgcolor="DarkTurquoise" rowspan="3"
            align="right" valign="bottom">
            <font color="red">4</font>
        </td>

        <td bgcolor="DeepSkyBlue" colspan="2"
            align="center">
            5
        </td>

        <td bgcolor="DodgerBlue" rowspan="2"
            align="left" valign="top">
            <font color="white" size="5">6</font>
        </td>
    </tr>

    <tr>
        <td bgcolor="HotPink"
            align="right" valign="top">
            7
        </td>

        <td bgcolor="CornflowerBlue"
            align="center">
            8
        </td>
    </tr>

    <tr>
        <td bgcolor="Lime" colspan="3"
            align="right" valign="bottom">
            <font color="gold" size="5">9</font>
        </td>
    </tr>

</table>

</body>
</html>
